<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Command Guard</title>
    <link rel="icon" type="image/png" href="/commandguard.png">

    <!-- Bootstrap CSS -->
    <link href="/css/bootstrap.min.css?v=1" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/css/font-awesome.min.css?v=1">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="/css/dataTables.bootstrap5.min.css?v=1">
    <!-- Prism.js for syntax highlighting -->
    <link href="/css/prism-tomorrow.min.css?v=1" rel="stylesheet">
    <!-- Notyf for notifications -->
    <link rel="stylesheet" href="/css/notyf.min.css?v=1">
    <!-- Overview visualization libraries -->
    <link rel="stylesheet" href="/css/dhtmlxgantt.css?v=10.0.0">
    <link rel="stylesheet" href="/css/tabulator.min.css?v=6.5.0">
    <!-- Tom Select (searchable dropdowns) -->
    <link rel="stylesheet" href="/css/tom-select.bootstrap5.min.css?v=2.4.3">
    <!-- xterm.js for persistent terminals -->
    <link rel="stylesheet" href="/css/xterm.css?v=6.0.0">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/app.css?v=57">
</head>
<body>
    <!-- Application Shell -->
    <header class="app-topbar fixed-top">
        <div class="container-fluid app-topbar-content">
            <button class="btn app-sidebar-toggle" type="button" id="sidebarToggle"
                    aria-label="Toggle navigation" aria-controls="appSidebar" aria-expanded="true">
                <i class="fas fa-bars"></i>
            </button>
            <a class="navbar-brand app-brand" href="#overview" data-page="overview">
                <i class="fas fa-terminal"></i> Command Guard
            </a>
        </div>
    </header>

    <aside class="app-sidebar" id="appSidebar" aria-label="Main navigation">
        <nav class="sidebar-nav">
            <div class="sidebar-section">
                <div class="sidebar-section-heading">Monitoring</div>
                <a class="nav-link sidebar-link" href="#overview" data-page="overview" title="Overview">
                    <i class="fas fa-calendar-day"></i>
                    <span>Overview</span>
                </a>
				<a class="nav-link sidebar-link" data-admin-only href="#dashboard" data-page="dashboard" title="Dashboard">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
				<a class="nav-link sidebar-link" data-admin-only href="#status" data-page="status" title="Status">
                    <i class="fas fa-info-circle"></i>
                    <span>Status</span>
                </a>
				<a class="nav-link sidebar-link" data-admin-only href="#diskmonitor" data-page="diskmonitor" title="Disk Monitor">
                    <i class="fas fa-hdd"></i>
                    <span>Disk Monitor</span>
                </a>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-heading">Operations</div>
				<a class="nav-link sidebar-link" data-admin-only href="#hosts" data-page="hosts" title="Hosts">
                    <i class="fas fa-server"></i>
                    <span>Hosts</span>
                </a>
                <a class="nav-link sidebar-link" href="#commands" data-page="commands" title="Commands">
                    <i class="fas fa-code"></i>
                    <span>Commands</span>
                </a>
                <a class="nav-link sidebar-link" href="#runbooks" data-page="runbooks" title="RunBooks">
                    <i class="fas fa-book"></i>
                    <span>RunBooks</span>
                </a>
                <a class="nav-link sidebar-link" href="#httprequests" data-page="httprequests" title="HTTP Requests">
                    <i class="fas fa-globe"></i>
                    <span>HTTP Requests</span>
                </a>
                <a class="nav-link sidebar-link" href="#terminals" data-page="terminals" title="Terminals">
                    <i class="fas fa-terminal"></i>
                    <span>Terminals</span>
                </a>
                <a class="nav-link sidebar-link" href="#remotedesktops" data-page="remotedesktops" title="Remote Desktops">
                    <i class="fas fa-desktop"></i>
                    <span>Remote Desktops</span>
                </a>
                <a class="nav-link sidebar-link" href="#logs" data-page="logs" title="Logs">
                    <i class="fas fa-history"></i>
                    <span>Logs</span>
                </a>
            </div>

			<div class="sidebar-section" data-admin-only>
                <div class="sidebar-section-heading">Configuration</div>
				<a class="nav-link sidebar-link" href="#users" data-page="users" title="Users & Security">
					<i class="fas fa-users-cog"></i><span>Users & Security</span>
				</a>
                <a class="nav-link sidebar-link" href="#pemfiles" data-page="pemfiles" title="PEM Files">
                    <i class="fas fa-key"></i>
                    <span>PEM Files</span>
                </a>
                <a class="nav-link sidebar-link" href="#variables" data-page="variables" title="Variables">
                    <i class="fas fa-variable"></i>
                    <span>Variables</span>
                </a>
                <a class="nav-link sidebar-link" href="#smtp" data-page="smtp" title="SMTP Settings">
                    <i class="fas fa-envelope"></i>
                    <span>SMTP Settings</span>
                </a>
                <a class="nav-link sidebar-link" href="#appsettings" data-page="appsettings" title="App Settings">
                    <i class="fas fa-sliders-h"></i>
                    <span>App Settings</span>
                </a>
                <a class="nav-link sidebar-link" href="#backuprestore" data-page="backuprestore" title="Backup & Restore">
                    <i class="fas fa-archive"></i>
                    <span>Backup & Restore</span>
                </a>
            </div>

            <div class="sidebar-section sidebar-section-system">
				<div id="currentIdentity" class="px-3 pb-2 small text-muted"></div>
				<a class="nav-link sidebar-link" href="#account" data-page="account" title="My Account">
					<i class="fas fa-user-shield"></i><span>My Account</span>
				</a>
                <a class="nav-link sidebar-link" href="#" id="btnLogout" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </div>
        </nav>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main Content Container -->
    <main class="container-fluid" id="mainContainer">
        <div id="mainContent">
            <!-- Content will be loaded here dynamically -->
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay d-none">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Command Execution Modal -->
    <div class="modal fade exec-log-modal" id="executeModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-play"></i> Execute Command
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="executionStatus" class="alert alert-info d-none"></div>
                    <div id="executionOutput"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Generic Form Modal -->
    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="formModalTitle">Form</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="formModalBody">
                    <!-- Form content will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="formModalSave">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="/js/jquery.min.js?v=1"></script>
    <!-- Bootstrap JS -->
    <script src="/js/bootstrap.bundle.min.js?v=1"></script>
    <!-- DataTables JS -->
    <script src="/js/jquery.dataTables.min.js?v=1"></script>
    <script src="/js/dataTables.bootstrap5.min.js?v=1"></script>
    <!-- Day.js for date formatting -->
    <script src="/js/dayjs.min.js?v=1"></script>
    <script src="/js/dayjs-relativeTime.js?v=1"></script>
    <!-- Prism.js for syntax highlighting -->
    <script src="/js/prism.min.js?v=1"></script>
    <script src="/js/prism-json.min.js?v=1"></script>
    <script src="/js/prism-bash.min.js?v=1"></script>
    <!-- SweetAlert2 for better alerts -->
    <script src="/js/sweetalert2.min.js?v=1"></script>
    <!-- Notyf for notifications -->
    <script src="/js/notyf.min.js?v=1"></script>
    <!-- QRCode.js for 2FA -->
    <script src="/js/qrcode.min.js?v=1"></script>
    <!-- Overview visualization libraries -->
    <script src="/js/echarts.min.js?v=6.0.0"></script>
    <script src="/js/dhtmlxgantt.js?v=10.0.0"></script>
    <script src="/js/tabulator.min.js?v=6.5.0"></script>
    <!-- Tom Select (searchable dropdowns) -->
    <script src="/js/tom-select.complete.min.js?v=2.4.3"></script>
    <!-- xterm.js terminal emulator and addons -->
    <script src="/js/xterm.min.js?v=6.0.0"></script>
    <script src="/js/xterm-addon-fit.min.js?v=0.11.0"></script>
    <script src="/js/xterm-addon-web-links.min.js?v=0.12.0"></script>
    <script src="/js/xterm-addon-webgl.min.js?v=0.19.0"></script>

    <!-- Application Scripts -->
    <!-- Load utilities and API first -->
    <script src="/js/utils.js?v=6"></script>
	<script src="/js/api.js?v=26"></script>
	<script src="/js/auth.js?v=2"></script>
    
    <!-- Load components before router -->
    <script src="/js/components/overview.js?v=6"></script>
    <script src="/js/components/dashboard.js?v=7"></script>
    <script src="/js/components/status.js?v=11"></script>
    <script src="/js/components/hosts.js?v=18"></script>
    <script src="/js/components/commands.js?v=32"></script>
    <script src="/js/components/runbooks.js?v=14"></script>
    <script src="/js/components/httprequests.js?v=1"></script>
	<script src="/js/components/logs.js?v=8"></script>
    <script src="/js/components/pemfiles.js?v=7"></script>
    <script src="/js/components/backuprestore.js?v=3"></script>
    <script src="/js/components/variables.js?v=1"></script>
    <script src="/js/components/smtp.js?v=6"></script>
    <script src="/js/components/appsettings.js?v=7"></script>
	<script src="/js/components/userops.js?v=3"></script>
	<script src="/js/components/account.js?v=1"></script>
	<script src="/js/components/userssecurity.js?v=5"></script>
	<script src="/js/components/terminals.js?v=28"></script>
	<script src="/js/components/diskmonitor.js?v=2"></script>
	<script src="/js/components/remotedesktops.js?v=4"></script>

    <!-- Load router after components -->
	<script src="/js/router.js?v=14"></script>
    
    <!-- Load main app last -->
	<script src="/js/app.js?v=5"></script>
</body>
</html>
